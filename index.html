<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Reakční doba</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="stylesheet" href="styles.css"><style>.editor{display:grid;gap:12px;margin-top:16px}.editor input[type=text]{font:inherit;padding:12px;border-radius:12px;border:1px solid #475569;background:#0f172a;color:#fff}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:8px 10px;background:#1e293b;border-radius:10px}.swatch{width:46px;height:46px;border-radius:10px;border:2px solid #fff}.draw{background:#fff;border-radius:14px;touch-action:none;width:min(100%,360px);height:220px}.preview-item{position:relative;width:72px;height:72px;border-radius:10px;background:#1e293b;display:grid;place-items:center;overflow:hidden;font-weight:900}.preview-item img{width:100%;height:100%;object-fit:cover}.del{position:absolute;right:1px;top:1px;border:0;border-radius:50%;width:22px;height:22px}</style></head><body><div id="app" class="app">
<section class="screen active" id="screen-players"><div class="card"><h1>Reakční doba</h1><p class="muted">Vyberte počet hráčů.</p><div class="grid4"><button class="big" data-players="1">1 hráč</button><button class="big" data-players="2">2 hráči</button><button class="big" data-players="3">3 hráči</button><button class="big" data-players="4">4 hráči</button></div></div></section>
<section class="screen" id="screen-topic"><div class="card"><h2>Téma</h2><div class="grid2"><button class="big primary" id="topic-shapes">Tvary</button><button class="big primary" id="topic-colors">Barvy</button><button class="big primary" id="topic-emoji">Emoji</button><button class="big primary" id="topic-words">Slova</button><button class="big primary" id="topic-custom">Vlastní</button></div><div class="row"><button class="ghost" id="back-to-players">← Zpět</button></div></div></section>
<section class="screen" id="screen-custom"><div class="card"><h2>Vlastní sada</h2><p class="muted">Přidejte alespoň 2 vlastní prvky. Typy můžete libovolně míchat.</p><div class="grid2"><button class="big custom-kind" data-editor="words">Slovo</button><button class="big custom-kind" data-editor="emoji">Emoji</button><button class="big custom-kind" data-editor="colors">Barva</button><button class="big custom-kind" data-editor="shapes">Nakreslit tvar</button><button class="big custom-kind" data-editor="photos">📷 Fotka</button></div><div id="custom-editor" class="editor"></div><h3>Moje prvky (<span id="custom-count">0</span>)</h3><div id="custom-preview" class="chips"></div><div class="row space" style="margin-top:16px"><button class="ghost" id="back-from-custom">← Zpět</button><button class="big primary" id="custom-next" disabled>Pokračovat</button></div><input id="photo-input" type="file" accept="image/*" capture="environment" style="display:none"></div></section>
<section class="screen" id="screen-scoring"><div class="card"><h2>Pravidla</h2><div class="grid2"><label class="radio"><span><b>Počet kol</b><br><select id="round-count"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></span></label><label class="radio"><span><b id="item-count-label">Počet prvků</b><br><select id="item-count"></select></span></label></div><div class="stack" style="margin-top:16px"><label class="radio"><input type="radio" name="scoring" value="classic" checked><span><b>Klasické</b> – první má 1 bod.</span></label><label class="radio"><input type="radio" name="scoring" value="3210"><span><b>3–2–1–0</b></span></label><label class="radio"><input type="radio" name="scoring" value="time"><span><b>Podle času</b> – nejnižší průměrný reakční čas.</span></label></div><div class="row space"><button class="ghost" id="back-to-topic">← Zpět</button><button class="big primary" id="go-to-game">Začít hru</button></div></div></section>
<section class="screen" id="screen-game"><div class="game" id="game-root"><button class="corner c-blue" id="p1"><div class="corner-name">Modrý</div><div class="corner-metric" id="metric1">0 b</div></button><button class="corner c-green" id="p2"><div class="corner-name">Zelený</div><div class="corner-metric" id="metric2">0 b</div></button><button class="corner c-red" id="p3"><div class="corner-name">Červený</div><div class="corner-metric" id="metric3">0 b</div></button><button class="corner c-yellow" id="p4"><div class="corner-name">Žlutý</div><div class="corner-metric" id="metric4">0 b</div></button><div class="center"><div class="frame" id="frame"><div id="frame-shape" class="shape hidden"></div></div><button class="start" id="btn-start">Start</button><div class="results hidden" id="results"><div class="results-top"><div><div class="results-title" id="results-title"></div><div class="results-sub" id="results-sub"></div></div><button class="pill-btn" id="btn-reset">Reset</button></div><div class="results-list" id="results-list"></div><button class="big primary" id="btn-next">Next →</button></div></div></div></section></div><script src="app-v10.js"></script></body></html>
