<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Reakční doba</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="stylesheet" href="styles.css"></head><body><div id="app" class="app" aria-live="polite">
<section class="screen active" id="screen-players"><button class="fs-btn" id="btn-fs" title="Fullscreen">⛶</button><div class="card"><h1>Reakční doba</h1><p class="muted">Vyberte počet hráčů.</p><div class="grid4"><button class="big" data-players="1">1 hráč</button><button class="big" data-players="2">2 hráči</button><button class="big" data-players="3">3 hráči</button><button class="big" data-players="4">4 hráči</button></div></div></section>
<section class="screen" id="screen-topic"><button class="fs-btn" id="btn-fs2" title="Fullscreen">⛶</button><div class="card"><h2>Téma</h2><p class="muted">Vyberte, na co budete reagovat.</p><div class="grid2"><button class="big primary" id="topic-shapes">Tvary</button><button class="big primary" id="topic-colors">Barvy</button><button class="big primary" id="topic-emoji">Emoji</button><button class="big primary" id="topic-words">Slova</button><button class="big primary" id="topic-custom">Vlastní</button></div><div class="row"><button class="ghost" id="back-to-players">← Zpět</button></div></div></section>
<section class="screen" id="screen-custom"><div class="card"><h2>Vlastní hra</h2><p class="muted">Vyberte, co se má ve hře střídat.</p><div class="grid2"><button class="big custom-kind" data-kind="shapes">Tvary</button><button class="big custom-kind" data-kind="colors">Barvy</button><button class="big custom-kind" data-kind="emoji">Emoji</button><button class="big custom-kind" data-kind="words">Slova</button><button class="big custom-kind primary" data-kind="mix">Mix všeho</button><button class="big custom-kind" data-kind="photos">Fotky</button></div><div id="photo-box" class="hidden" style="margin-top:18px"><p class="muted">Vyfoťte alespoň 2 různé fotky. Na telefonu se otevře fotoaparát.</p><input id="photo-input" type="file" accept="image/*" capture="environment" multiple style="display:none"><button class="big primary" id="take-photo">📷 Přidat fotku</button><div id="photo-preview" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"></div><div id="photo-count" class="muted" style="margin-top:8px">0 fotek</div><div class="row" style="margin-top:12px"><button class="big primary" id="photos-next" disabled>Pokračovat</button></div></div><div class="row"><button class="ghost" id="back-from-custom">← Zpět</button></div></div></section>
<section class="screen" id="screen-scoring"><button class="fs-btn" id="btn-fs3" title="Fullscreen">⛶</button><div class="card"><h2>Pravidla</h2><p class="muted">Nastavte hru a bodování.</p><div class="grid2" style="margin-bottom:16px"><label class="radio"><span><b>Počet kol</b><br><select id="round-count" style="margin-top:8px;font:inherit;padding:8px 12px;border-radius:10px;background:#111827;color:#fff;border:1px solid rgba(255,255,255,.18)"><option value="5">5</option><option value="10" selected>10</option><option value="15">15</option><option value="20">20</option></select></span></label><label class="radio"><span><b id="item-count-label">Počet prvků</b><br><select id="item-count" style="margin-top:8px;font:inherit;padding:8px 12px;border-radius:10px;background:#111827;color:#fff;border:1px solid rgba(255,255,255,.18)"></select></span></label></div><div class="stack"><label class="radio"><input type="radio" name="scoring" value="classic" checked><span><b>Klasické</b> – první má 1 bod, ostatní 0. (Rohy ukazují body.)</span></label><label class="radio"><input type="radio" name="scoring" value="3210"><span><b>3–2–1–0</b> – 1. má 3, 2. má 2, 3. má 1, 4. má 0. (Rohy ukazují body.)</span></label><label class="radio"><input type="radio" name="scoring" value="time"><span><b>Podle času</b> – soutěží se o nejnižší průměrný reakční čas. (Rohy ukazují průměrný čas.)</span></label></div><div class="row space"><button class="ghost" id="back-to-topic">← Zpět</button><button class="big primary" id="go-to-game">Začít hru</button></div></div></section>
<section class="screen" id="screen-game"><div class="game" id="game-root"><button class="corner c-blue" id="p1"><div class="corner-name">Modrý</div><div class="corner-metric" id="metric1">0 b</div></button><button class="corner c-green" id="p2"><div class="corner-name">Zelený</div><div class="corner-metric" id="metric2">0 b</div></button><button class="corner c-red" id="p3"><div class="corner-name">Červený</div><div class="corner-metric" id="metric3">0 b</div></button><button class="corner c-yellow" id="p4"><div class="corner-name">Žlutý</div><div class="corner-metric" id="metric4">0 b</div></button><div class="center"><div class="frame" id="frame"><div id="frame-shape" class="shape hidden"></div></div><button class="start" id="btn-start">Start</button><div class="countdown hidden" id="countdown">3</div><div class="results hidden" id="results"><div class="results-top"><div><div class="results-title" id="results-title">Výsledky kola</div><div class="results-sub" id="results-sub"></div></div><button class="pill-btn" id="btn-reset">Reset</button></div><div class="results-list" id="results-list"></div><div class="row space"><button class="big primary" id="btn-next">Next →</button></div></div></div></div></section>
</div><script src="app-v9.js"></script></body></html>
